apiVersion: apps/v1
kind: Deployment
metadata:
  name: pythontest
  labels:
    app: pythontest
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pythontest
  template:
    metadata:
      labels:
        app: pythontest
    spec:
      containers:
        - name: pythontest
          image: host.minikube.internal:4000/pythontest:latest
          imagePullPolicy: Always
          ports:
            - name: microport
              containerPort: 5000
